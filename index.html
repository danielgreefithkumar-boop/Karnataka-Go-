    <script>
      (function() {
        // Prevent "Cannot set property fetch of #<Window> which has only a getter"
        // caused by browser extensions attempting to monkey-patch window.fetch
        try {
          var originalFetch = window.fetch;
          var fetchInstance = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchInstance;
            },
            set: function(fn) {
              fetchInstance = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return protoFetch;
              },
              set: function(fn) {
                protoFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }

        // Suppress uncaught errors from external browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
